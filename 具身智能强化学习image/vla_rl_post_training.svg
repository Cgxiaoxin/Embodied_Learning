<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>VLA + RL 后训练范式</title>
  <desc>展示模仿学习预训练、VLA 基础模型、RL 精调、部署的完整流程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">VLA + RL 后训练范式</text>

  <g>
    <rect x="20" y="55" width="140" height="95" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="90" y="78" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#085041">阶段 1</text>
    <text x="90" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#0f6e56">模仿学习 IL</text>
    <text x="90" y="118" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#0f6e56">人类示教 Demos</text>
    <text x="90" y="135" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#0f6e56">行为克隆 / VLA 预训练</text>
  </g>

  <line x1="162" y1="102" x2="188" y2="102" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="55" width="140" height="95" rx="8" fill="#eeeefd" stroke="#534ab7" stroke-width="0.5"/>
    <text x="260" y="78" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#3c3489">阶段 2</text>
    <text x="260" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#534ab7">VLA 基础模型</text>
    <text x="260" y="118" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#534ab7">语言泛化 + 基础操作</text>
    <text x="260" y="135" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#534ab7">π0 / GR00T / OpenVLA</text>
  </g>

  <line x1="332" y1="102" x2="358" y2="102" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="360" y="55" width="140" height="95" rx="8" fill="#e6f1fb" stroke="#2a78d6" stroke-width="0.5"/>
    <text x="430" y="78" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0c447c">阶段 3</text>
    <text x="430" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#185fa5">RL 后训练</text>
    <text x="430" y="118" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#185fa5">PPO / GRPO / RECAP</text>
    <text x="430" y="135" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#185fa5">从成功/失败中改进</text>
  </g>

  <line x1="502" y1="102" x2="528" y2="102" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="530" y="55" width="130" height="95" rx="8" fill="#fff3e6" stroke="#c45a00" stroke-width="0.5"/>
    <text x="595" y="78" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#8a3d00">阶段 4</text>
    <text x="595" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#c45a00">部署</text>
    <text x="595" y="118" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#c45a00">Sim-to-Real</text>
    <text x="595" y="135" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="10" fill="#c45a00">真实机器人执行</text>
  </g>

  <path d="M595 152 Q595 210 430 210 Q260 210 260 152" fill="none" stroke="#c45a00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="430" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#c45a00">自采集轨迹 → 批评模型 → 优势标签 → 策略更新</text>

  <g>
    <rect x="20" y="260" width="200" height="115" rx="8" fill="#f5f5f4" stroke="#52514e" stroke-width="0.5"/>
    <text x="120" y="285" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">π0.6 RECAP</text>
    <text x="120" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">执行轨迹 → 批评评估</text>
    <text x="120" y="326" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">密集优势标签 → RL 微调</text>
    <text x="120" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">直接在动作空间改进</text>
    <text x="120" y="362" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">知识隔离保护 VLM</text>
  </g>

  <g>
    <rect x="240" y="260" width="200" height="115" rx="8" fill="#f5f5f4" stroke="#52514e" stroke-width="0.5"/>
    <text x="340" y="285" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">GRPO 用于 VLA</text>
    <text x="340" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">同 prompt 多采样</text>
    <text x="340" y="326" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">组内相对优势，无 Critic</text>
    <text x="340" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">显存友好</text>
    <text x="340" y="362" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">提升空间推理 / 规划</text>
  </g>

  <g>
    <rect x="460" y="260" width="200" height="115" rx="8" fill="#f5f5f4" stroke="#52514e" stroke-width="0.5"/>
    <text x="560" y="285" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">核心优势</text>
    <text x="560" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">IL 提供安全初始化</text>
    <text x="560" y="326" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">RL 突破示教上限</text>
    <text x="560" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">语言泛化 + 任务特化</text>
    <text x="560" y="362" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#52514e">适合复杂长程任务</text>
  </g>
</svg>